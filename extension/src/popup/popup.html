<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xslop</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<script type="module" src="popup.js"></script>
</head>
<body class="popup">
<header class="head">
  <h1><img src="wordmark.svg" alt="xslop" width="81" height="28"></h1>
  <p id="headline" class="pill" role="status"></p>
</header>

<dl class="glance" aria-label="Today in numbers">
  <div><dt>Hidden today</dt><dd id="stat-hidden">0</dd></div>
  <div><dt>Shared list</dt><dd id="stat-list">0</dd></div>
  <div><dt>You marked</dt><dd id="stat-mine">0</dd></div>
</dl>

<div id="access" class="notice" hidden>
  <p>xslop needs access to x.com and x-slop.com.</p>
  <button id="access-grant" class="btn primary" type="button">Allow access</button>
  <p id="access-help" class="hint" hidden>Your browser did not ask. Allow xslop on x.com in its extension settings.</p>
</div>
<ul id="notices" class="notices" aria-live="polite"></ul>

<section class="block" aria-labelledby="h-list">
  <div class="list-head">
    <h2 id="h-list" tabindex="-1">Your list <span id="count" class="muted"></span></h2>
    <span id="standing" class="badge" hidden>Counts for the shared list</span>
  </div>
  <input id="search" class="input" type="search" placeholder="Search @handle" aria-label="Search your list" autocomplete="off" spellcheck="false" hidden>
  <ul id="votes" class="votes" aria-labelledby="h-list"></ul>
  <p id="more" class="hint" hidden></p>
  <p id="empty" class="hint" hidden></p>
  <div id="toast" class="toast" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" class="link" type="button" aria-describedby="toast-msg">Undo</button>
  </div>
</section>

<section class="block settings" aria-labelledby="h-settings">
  <h2 id="h-settings" class="sr-only">Settings</h2>
  <div class="field">
    <span id="l-hide" class="field-label">Hide</span>
    <div class="seg" role="radiogroup" aria-labelledby="l-hide" aria-describedby="strict-hint">
      <label><input type="radio" name="strictness" value="off"><span>Off</span></label>
      <label><input type="radio" name="strictness" value="balanced"><span>Balanced</span></label>
      <label><input type="radio" name="strictness" value="strict"><span>Strict</span></label>
    </div>
    <p id="strict-hint" class="hint"></p>
  </div>
  <div class="field">
    <span id="l-display" class="field-label">Hidden posts</span>
    <div class="seg" role="radiogroup" aria-labelledby="l-display">
      <label><input type="radio" name="display" value="collapse"><span>One line</span></label>
      <label><input type="radio" name="display" value="remove"><span>Remove</span></label>
    </div>
  </div>
  <label class="switch">
    <input type="checkbox" id="mute-mark" role="switch">
    <span class="track" aria-hidden="true"></span>
    <span class="label"><strong>Mute when you mark</strong>
      <span class="hint">Hides it in the X app too.</span></span>
  </label>
  <label class="switch">
    <input type="checkbox" id="mute" role="switch">
    <span class="track" aria-hidden="true"></span>
    <span class="label"><strong>Mute the shared list</strong>
      <span class="hint">Up to <span id="mute-max">40</span> a day. Needs an open x.com tab.</span></span>
  </label>
  <p id="mute-state" class="hint state" aria-live="polite"></p>
  <button id="undo-mutes" class="btn small" type="button" hidden>Undo all xslop mutes</button>
  <label class="switch">
    <input type="checkbox" id="share" role="switch">
    <span class="track" aria-hidden="true"></span>
    <span class="label"><strong>Share anonymous signals</strong>
      <span class="hint">Reply handles and post ids. Nothing else.</span></span>
  </label>
</section>

<footer class="foot">
  <a href="onboarding.html" target="_blank">How xslop works</a>
  <a href="https://x-slop.com/check" target="_blank" rel="noopener">Appeal a listing</a>
</footer>
</body>
</html>
